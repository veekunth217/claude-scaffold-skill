name: Sync Skill Registry

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write
  issues: write

jobs:
  discover-skills:
    runs-on: ubuntu-latest
    name: Discover new Claude Code skills on GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # PAT (not GITHUB_TOKEN) so pushes bypass branch-protection rulesets.
          # Persisted into git config, so all subsequent `git push` calls use it.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run skill discovery scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch-skills.py --output registry/discovered.json

      - name: Check for new discoveries
        id: check-new
        run: |
          if [ -f registry/discovered.json ]; then
            NEW=$(python -c "import json; d=json.load(open('registry/discovered.json')); print(d.get('new_this_run', len(d.get('newly_added_this_run', []))))")
            QUEUE=$(python -c "import json; d=json.load(open('registry/discovered.json')); print(d.get('queue_size', len(d.get('new_discoveries', []))))")
            echo "new_count=$NEW" >> $GITHUB_OUTPUT
            echo "queue_size=$QUEUE" >> $GITHUB_OUTPUT
            echo "$NEW new candidate(s) this run; $QUEUE total in the review queue."
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
            echo "queue_size=0" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push registry updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # discovered.json is fully owned by this job (regenerated each run) —
          # snapshot it so we can lay it back after syncing to the latest remote.
          cp registry/discovered.json /tmp/discovered.json
          # Sync to the freshest remote so the push is a clean fast-forward AND
          # we don't clobber registry edits made while this job was running.
          git fetch origin main
          git reset --hard origin/main
          # Restore the runner-owned file on top of the up-to-date tree
          cp /tmp/discovered.json registry/discovered.json
          # Refresh star counts on the FRESH skills.json (not a stale snapshot) —
          # this is why a concurrent "add a new skill" commit won't be reverted.
          python scripts/update-stars.py
          git add registry/discovered.json registry/skills.json
          if git diff --staged --quiet; then
            echo "No registry changes — nothing to push."
          else
            git commit -m "chore: update discovered skills + star counts [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build issue body
        if: steps.check-new.outputs.new_count != '0'
        id: build-body
        run: |
          python << 'EOF'
          import json, os

          GITHUB_BODY_LIMIT = 65000  # GitHub hard limit is 65536; leave headroom
          TOP_N = 40                 # how many of the new ones to list in the Issue

          with open("registry/discovered.json") as f:
              data = json.load(f)

          new_skills = data.get("newly_added_this_run", [])
          queue_size = data.get("queue_size", len(data.get("new_discoveries", [])))
          if not new_skills:
              print("No new skills to report")
              exit(0)

          # newly_added_this_run is already sorted by quality_score desc
          total_new = len(new_skills)
          top = new_skills[:TOP_N]
          rest = total_new - len(top)

          def short(s, n):
              s = (s or "").replace("|", "\\|").replace("\n", " ").strip()
              return (s[:n] + "…") if len(s) > n else s

          lines = [
              "## New Claude Code Skills — first seen this run",
              "",
              f"**{total_new} new candidate(s)** appeared since the last scrape. "
              f"(Total review queue now: **{queue_size}** — see [`registry/discovered.json`](../blob/main/registry/discovered.json), sorted by quality score.)",
              "",
              "> Quality score (0–100): +30 SKILL.md · +20 canonical topic · +20 good description · "
              "+15 stars≥10 · +10 recent push · +5 README · −30 archived. "
              "Flags like `low_stars`, `stale`, `thin_desc` lower priority but don't block. "
              "**Nothing here is in `skills.json` yet — this is a review queue, not an auto-add.**",
              "",
          ]

          if rest > 0:
              lines.append(f"Listing the **top {len(top)}** new ones by score; the other **{rest}** are in `discovered.json`.")
              lines.append("")

          lines += [
              "| Score | Repo | ⭐ | Description | Flags |",
              "|------:|------|---:|-------------|-------|",
          ]
          for skill in top:
              repo = skill.get("repo", "")
              score = skill.get("quality_score", "?")
              stars = skill.get("stars", 0)
              desc = short(skill.get("description", "No description"), 70)
              flags = ", ".join(f for f in skill.get("quality_flags", []) if f not in ("has_skill_md", "has_readme", "canonical_topic")) or "—"
              lines.append(f"| {score} | [{repo}](https://github.com/{repo}) | {stars} | {desc} | {flags} |")

          lines += [
              "",
              "### To add one to the registry",
              "1. Review the repo + its `SKILL.md` — does it follow confirm-before-generate? focused scope? safe install path?",
              "2. Add an entry to `registry/skills.json` (schema in CONTRIBUTING.md)",
              "3. Set `\"verified\": true` after review · 4. Open a PR",
              "",
              "_Auto-generated by the weekly skill discovery workflow._",
          ]

          body = "\n".join(lines)
          if len(body) > GITHUB_BODY_LIMIT:
              body = body[:GITHUB_BODY_LIMIT - 200] + "\n\n_…truncated. See `registry/discovered.json` for the complete list._"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ISSUE_BODY<<__ISSUE_EOF__\n{body}\n__ISSUE_EOF__\n")
          EOF

      - name: Open GitHub Issue for new discoveries
        if: steps.check-new.outputs.new_count != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let body = process.env.ISSUE_BODY || '(body unavailable)';
            const newCount = '${{ steps.check-new.outputs.new_count }}';
            if (body.length > 65000) body = body.slice(0, 64800) + '\n\n_…truncated._';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Registry] ${newCount} new candidate skill(s) this week — review`,
              body: body,
              labels: ['registry', 'needs-review']
            });

      - name: No new skills this run
        if: steps.check-new.outputs.new_count == '0'
        run: |
          echo "No NEW skills since the last scrape."
          echo "Review queue still holds ${{ steps.check-new.outputs.queue_size }} candidate(s) in registry/discovered.json."

  update-capabilities:
    runs-on: ubuntu-latest
    name: Scan Anthropic docs for new Claude Code capabilities
    needs: discover-skills

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # always pull latest after discover-skills may have pushed
          token: ${{ secrets.PAT_TOKEN }}  # PAT so pushes bypass branch protection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Anthropic docs for capabilities
        run: python scripts/fetch-capabilities.py --output registry/discovered-capabilities.json

      - name: Check for new capability discoveries
        id: check-caps
        run: |
          if [ -f registry/discovered-capabilities.json ]; then
            COUNT=$(python -c "import json; data=json.load(open('registry/discovered-capabilities.json')); print(data.get('new_count', 0))")
            echo "new_count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT potentially new capabilities"
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Commit discovered capabilities
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Snapshot the regenerated file, reset to latest remote, lay it back on top
          cp registry/discovered-capabilities.json /tmp/discovered-capabilities.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/discovered-capabilities.json registry/discovered-capabilities.json
          git add registry/discovered-capabilities.json
          if git diff --staged --quiet; then
            echo "No capability changes — nothing to push."
          else
            git commit -m "chore: update discovered capabilities scan [skip ci]"
            git push origin HEAD:main
          fi

      - name: Open issue for new capability discoveries
        if: steps.check-caps.outputs.new_count != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('registry/discovered-capabilities.json', 'utf8'));
            const caps = data.new_capabilities || [];
            const count = caps.length;

            const rows = caps.map(c =>
              `| ${c.name} | ${c.category} | ${c.tags.join(', ')} | \`${c.matched_pattern}\` |`
            ).join('\n');

            let body = [
              `## New Claude Code Capabilities Detected`,
              ``,
              `The weekly docs scan found **${count} capability/feature(s)** not yet in \`registry/claude-capabilities.json\`.`,
              ``,
              `These were detected by pattern-matching the Anthropic Claude Code docs pages.`,
              `Review each one and add verified entries to \`registry/claude-capabilities.json\`.`,
              ``,
              `| Name | Category | Tags | Pattern matched |`,
              `|------|----------|------|-----------------|`,
              rows,
              ``,
              `### To add a capability:`,
              `1. Verify it's a real, documented Claude Code feature`,
              `2. Add an entry to \`registry/claude-capabilities.json\` following existing format`,
              `3. Open a PR`,
              ``,
              `---`,
              `_Auto-generated by the weekly capability scan workflow. Full scan: \`registry/discovered-capabilities.json\`._`
            ].join('\n');
            if (body.length > 65000) body = body.slice(0, 64800) + '\n\n_…truncated. See registry/discovered-capabilities.json._';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Capabilities] ${count} new Claude Code feature(s) detected — review needed`,
              body: body,
              labels: ['capabilities', 'needs-review']
            });

      - name: No new capabilities found
        if: steps.check-caps.outputs.new_count == '0'
        run: echo "No new capabilities detected. claude-capabilities.json is up to date."
