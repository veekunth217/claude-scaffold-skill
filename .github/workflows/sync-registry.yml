name: Sync Skill Registry

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write
  issues: write

jobs:
  discover-skills:
    runs-on: ubuntu-latest
    name: Discover new Claude Code skills on GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh star counts in skills.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update-stars.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/skills.json
          git diff --staged --quiet || git commit -m "chore: refresh star counts [skip ci]"

      - name: Run skill discovery scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch-skills.py --output registry/discovered.json

      - name: Check for new discoveries
        id: check-new
        run: |
          if [ -f registry/discovered.json ]; then
            COUNT=$(python -c "import json; data=json.load(open('registry/discovered.json')); print(len(data.get('new_discoveries', [])))")
            echo "new_count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT new skills"
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push registry updates
        run: |
          git add registry/discovered.json
          git diff --staged --quiet || git commit -m "chore: update discovered skills registry [skip ci]"
          git push

      - name: Build issue body
        if: steps.check-new.outputs.new_count != '0'
        id: build-body
        run: |
          python << 'EOF'
          import json, os

          with open("registry/discovered.json") as f:
              data = json.load(f)

          new_skills = data.get("new_discoveries", [])
          if not new_skills:
              print("No new skills to report")
              exit(0)

          lines = [
              "## New Claude Code Skills Discovered",
              "",
              f"The weekly scraper found **{len(new_skills)} new skill(s)** not yet in the main registry.",
              "",
              "Review each one below and add verified skills to `registry/skills.json` via a PR.",
              "",
              "| Repo | Stars | Description | Topics | SKILL.md |",
              "|------|-------|-------------|--------|----------|",
          ]

          for skill in new_skills:
              repo = skill.get("repo", "")
              stars = skill.get("stars", 0)
              desc = skill.get("description", "No description")[:80]
              topics = ", ".join(skill.get("topics", [])[:4]) or "—"
              skill_url = f"https://github.com/{repo}/blob/main/SKILL.md"
              lines.append(f"| [{repo}](https://github.com/{repo}) | ⭐ {stars} | {desc} | {topics} | [SKILL.md]({skill_url}) |")

          lines += [
              "",
              "### To add a skill to the registry:",
              "1. Review the repo and its SKILL.md",
              "2. Add an entry to `registry/skills.json` following the existing format",
              "3. Set `\"verified\": true` after review",
              "4. Open a PR with the addition",
              "",
              "---",
              "_This issue was auto-generated by the weekly skill discovery workflow._"
          ]

          body = "\n".join(lines)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ISSUE_BODY<<EOF\n{body}\nEOF\n")
          EOF

      - name: Open GitHub Issue for new discoveries
        if: steps.check-new.outputs.new_count != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = process.env.ISSUE_BODY;
            const count = '${{ steps.check-new.outputs.new_count }}';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Registry] ${count} new skill(s) discovered — review needed`,
              body: body,
              labels: ['registry', 'needs-review']
            });

      - name: No new skills found
        if: steps.check-new.outputs.new_count == '0'
        run: echo "No new skills discovered this week. Registry is up to date."
